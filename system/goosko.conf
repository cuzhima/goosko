server {
    listen 80 default_server;
    server_name _;

    # ===== РЕАЛЬНЫЙ IP КЛИЕНТА =====
    # cloudflared и tailscale-funnel коннектятся к Angie с localhost, поэтому
    # $remote_addr всегда 127.0.0.1. У Cloudflare настоящий клиент — только в
    # CF-Connecting-IP (CF его перезаписывает, спуфнуть сквозь CF нельзя);
    # в X-Forwarded-For у CF последний элемент — IP их edge, а не клиента.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # 🎨 Кастомные страницы ошибок
    error_page 401 /error-pages/401.html;
    error_page 403 /error-pages/403.html;
    error_page 404 /error-pages/404.html;
    error_page 429 /error-pages/429.html;
    error_page 500 /error-pages/500.html;
    error_page 502 /error-pages/502.html;
    error_page 503 /error-pages/503.html;
    error_page 504 /error-pages/504.html;
    
    # Директория со страницами ошибок
    location /error-pages/ {
        alias /var/www/error-pages/;
        internal;   # Доступ только из Nginx, не напрямую
    }

    client_max_body_size 4096m;

    # ===== СТАТИКА САЙТА (CSS, JS) =====
    location /static/ {
        alias /home/andrey/goosko-site/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ===== ПУБЛИЧНАЯ ЗОНА (отдаём напрямую) =====
    location /public/ {
        alias /var/www/storage/public/;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        charset utf-8;

        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        # Используем map из nginx.conf для безопасного Content-Disposition
        add_header Content-Disposition $goosko_public_disposition;
    }
    # ===== ПРИВАТНЫЕ ФАЙЛЫ ЧЕРЕЗ X-ACCEL-REDIRECT =====
    # Flask отправляет заголовок X-Accel-Redirect, Nginx отдаёт файл сам
    location /protected/ {
        internal;
        alias /var/www/storage/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }

    # ===== ВРЕМЕННЫЕ ССЫЛКИ ДЛЯ ПУБЛИЧНЫХ ФАЙЛОВ =====
    # Для /share/<token> - отдаём как attachment
    location /public-protected/ {
        internal;
        alias /var/www/storage/public/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }

location /private/ {
    # ВАЖНО: единственный location этого пути. Раньше здесь был ещё regex
    # ~ ^/private/(.*)$ — он имел более высокий приоритет и рвал заголовки
    # (Host/XFF/CF-Connecting-IP не доходили до Flask: audit IP был 127.0.0.1,
    # а клиент мог подделать CF-Connecting-IP). Единственный блок — ниже.
    proxy_pass http://127.0.0.1:5000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $goosko_client_xff;
    proxy_set_header X-Forwarded-Proto $goosko_proto;
    proxy_set_header CF-Connecting-IP $goosko_cf_ip;

    proxy_buffering off;
    proxy_read_timeout 300s;
}



    # ===== Проверка Flask-сессии для защищённых сервисов =====
    location = /auth-check {
        internal;

        proxy_pass http://127.0.0.1:5000/check;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $goosko_proto;
        proxy_set_header CF-Connecting-IP $goosko_cf_ip;
    }

    location @login_redirect {
        return 302 /;
    }

    # ===== Termix через внутренний путь /__termix__/ =====
    location = /__termix__ {
        return 301 /__termix__/;
    }

    location /__termix__/ {
        auth_request /auth-check;
        error_page 401 = @login_redirect;

        # ВАЖНО: Termix у тебя внутри слушает 127.0.0.1:8080
        # Слэш в конце proxy_pass нужен, чтобы Nginx обрезал /__termix__/
        proxy_pass http://127.0.0.1:8080/;

        proxy_http_version 1.1;

        proxy_set_header Host termix.goosko.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $goosko_client_xff;
        proxy_set_header X-Forwarded-Proto $goosko_proto;
        proxy_set_header CF-Connecting-IP $goosko_cf_ip;
        proxy_set_header X-Forwarded-Host termix.goosko.online;

        # WebSocket для SSH/RDP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

# ===== Cockpit через внутренний путь /__cockpit__/ =====
location = /__cockpit__ {
    return 301 /__cockpit__/;
}

location /__cockpit__/ {
    auth_request /auth-check;
    error_page 401 = @login_redirect;

    proxy_pass https://127.0.0.1:9090/;
    proxy_http_version 1.1;
    
    # ✅ ВАЖНО: cockpit-tls использует самоподписанный сертификат
    proxy_ssl_verify off;
    proxy_ssl_server_name off;

    # Передаём оригинальный Host (не переопределяем)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $goosko_client_xff;
    proxy_set_header X-Forwarded-Proto $goosko_proto;
    proxy_set_header CF-Connecting-IP $goosko_cf_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /__cockpit__;

    # WebSocket для Cockpit (терминал, графики)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Отключаем буферизацию
    proxy_buffering off;
    proxy_request_buffering off;

    # Таймауты
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Отдельный location для WebSocket endpoint
location = /__cockpit__/socket {
    auth_request /auth-check;
    error_page 401 = @login_redirect;

    proxy_pass https://127.0.0.1:9090/socket;
    proxy_http_version 1.1;
    
    proxy_ssl_verify off;
    proxy_ssl_server_name off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $goosko_client_xff;
    proxy_set_header X-Forwarded-Proto $goosko_proto;
    proxy_set_header CF-Connecting-IP $goosko_cf_ip;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

    # ===== Основной сайт Flask =====
    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $goosko_client_xff;
        proxy_set_header X-Forwarded-Proto $goosko_proto;
        proxy_set_header CF-Connecting-IP $goosko_cf_ip;
        proxy_set_header X-Forwarded-Host $http_host;

    # ✅ Не буферизовать большие тела на диск — стримим напрямую
    proxy_request_buffering off;

    # ✅ Таймауты на долгую загрузку (1 час)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;
    }

    # ===== ЗАПРЕТ ВЫПОЛНЕНИЯ СКРИПТОВ В ХРАНИЛИЩЕ =====
    # Даже если кто-то загрузит .php/.py/.sh, Nginx их не выполнит
    location ~* ^/(public|public-protected|protected)/.*\.(php|phtml|php3|php5|cgi|pl|py|sh|bat|cmd)$ {
        deny all;
    }
}
