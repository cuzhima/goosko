# Реальная схема запроса: Cloudflare -> X-Forwarded-Proto / CF-Visitor,
# локальный вход -> $scheme. Нужно для корректных cookie и redirect.
map $http_cf_visitor $goosko_cf_scheme {
    default                   "";
    ~*"scheme"\s*:\s*"https"  https;
}

map "$http_x_forwarded_proto:$goosko_cf_scheme" $goosko_proto {
    default     $scheme;
    ~*^https:   https;
    ~*^http:    http;
    ~*:https$   https;
}
