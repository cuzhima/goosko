# Реальная схема запроса: Cloudflare -> X-Forwarded-Proto / CF-Visitor,
# локальный вход -> $scheme. Нужно для корректных cookie и redirect.
map $http_cf_visitor $goosko_cf_scheme {
    default                   "";
    ~*"scheme"\s*:\s*"https"  https;
}

map "$http_x_forwarded_proto:$goosko_cf_scheme" $goosko_proto {
    default     $scheme;
    ~*^https:   https;
    ~*^http:    http;
    ~*:https$   https;
}

# Единый клиентский IP для Flask: после real_ip (CF-Connecting-IP) $remote_addr
# — клиент. Исключение — tailscale funnel (CF-Connecting-IP нет, remote остаётся
# 127.0.0.1): там настоящий tailnet-IP несёт X-Forwarded-For от tailscale.
map $remote_addr $goosko_client_xff {
    default     $remote_addr;
    ~^127\.     $http_x_forwarded_for;
    ::1         $http_x_forwarded_for;
}

# CF-Connecting-IP передаём Flask только от локальных прокси (cloudflared,
# tailscale funnel). Сторонний клиент мог бы подделать этот заголовок и обойти
# лимиты входа — всем остальным шлём пустоту (после real_ip у запросов через
# CF $remote_addr уже не 127-й, поэтому им заголовок не достанется; Flask
# возьмёт клиента из X-Forwarded-For).
map $remote_addr $goosko_cf_ip {
    default     "";
    ~^127\.     $http_cf_connecting_ip;
    ::1         $http_cf_connecting_ip;
}
